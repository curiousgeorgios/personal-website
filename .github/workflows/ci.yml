name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main part-way through a deploy or a remote migration
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run db:migrate:local
      - run: bun run seed:media --local
      - run: bun run seed:snapshots --local
      - run: bun run build:test
      - run: bun run check:worker
      # Local Browser Rendering (the snapshot specs) downloads Chrome on first use; keep it between runs. Saved after the
      # e2e step whether it passed or failed, so a red run doesn't make the next one download Chrome again, but not when the run
      # was cancelled: a cancelled run may never have launched Chrome, and would save the previous one under the new key
      - uses: actions/cache/restore@v6
        id: chrome
        with:
          path: ~/.cache/.wrangler/chrome
          key: wrangler-chrome-${{ hashFiles('bun.lock') }}
          restore-keys: wrangler-chrome-
      - run: bun run test:e2e
        env:
          # Stripe's test mode, for the one full order through checkout.stripe.com; the spec skips without it
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      # A run that died mid-download leaves a partial Chrome, and an exact-key hit would then serve it until bun.lock changes.
      # Miniflare writes a marker into a version's directory once it is fully extracted, so save only when every one has it
      - id: chrome-complete
        if: ${{ !cancelled() }}
        run: |
          ready=false
          for dir in ~/.cache/.wrangler/chrome/*/; do
            [ -e "$dir" ] || continue
            ready=true
            [ -e "${dir}.miniflare-install-complete" ] || { ready=false; break; }
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' && steps.chrome.outputs.cache-hit != 'true' && steps.chrome-complete.outputs.ready == 'true' }}
        with:
          path: ~/.cache/.wrangler/chrome
          key: wrangler-chrome-${{ hashFiles('bun.lock') }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Test hooks, the admin bypass and the test-only print vars must never reach production
      - run: if grep -rqE "__deck|admin-bypass|EMAIL_SINK|PRINT_RETRY_WINDOW" dist; then echo "test hooks, the admin bypass or a test-only var leaked into the production build"; exit 1; fi
      - run: bun run check:worker
      # All the fallible setup happens before anything touches production
      - run: bunx playwright install --with-deps chromium
      # A missing zone id would otherwise surface only after production has been deployed
      - name: Check the cache purge secret is set
        run: if [ -z "$CLOUDFLARE_ZONE_ID" ]; then echo "CLOUDFLARE_ZONE_ID is not set"; exit 1; fi
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - run: bun run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The snapshots Worker first: the main Worker's SNAPSHOTS binding needs it to exist
      - run: bunx wrangler deploy -c workers/snapshots/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Edge-cached HTML must never outlive the hashed scene loader it points at (ADR-0010)
      - name: Purge the cached pages
        run: >-
          curl -sS --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache"
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"
          --data '{"tags":["logbook","photos"]}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      # The visitor info's promises, the starting crate's media (a forgotten seed:media shows up here) and a closed /admin, checked against the live site
      - run: bunx playwright test tests/e2e/privacy.spec.ts tests/e2e/media-live.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: https://curiousgeorge.dev
          PRIVACY_PATH: /?deploy=${{ github.sha }}
      # Spec 11's page budgets on the live site (Lighthouse, mobile, median of five). Over budget is a warning on the
      # run, not a failed deploy; the interaction and layout budgets are gated in the check job.
      - run: bun run lighthouse https://curiousgeorge.dev/
        continue-on-error: true
