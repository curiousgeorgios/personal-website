name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main part-way through a deploy or a remote migration
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run db:migrate:local
      - run: bun run seed:media --local
      - run: bun run build:test
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Test hooks and the admin bypass must never reach production
      - run: if grep -rqE "__deck|admin-bypass" dist; then echo "test hooks or the admin bypass leaked into the production build"; exit 1; fi
      # All the fallible setup happens before anything touches production
      - run: bunx playwright install --with-deps chromium
      # A missing zone id would otherwise surface only after production has been deployed
      - name: Check the cache purge secret is set
        run: if [ -z "$CLOUDFLARE_ZONE_ID" ]; then echo "CLOUDFLARE_ZONE_ID is not set"; exit 1; fi
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - run: bun run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Edge-cached HTML must never outlive the hashed scene loader it points at (ADR-0010)
      - name: Purge the cached home page
        run: >-
          curl -sS --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache"
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"
          --data '{"tags":["logbook"]}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      # The visitor info's promises and the starting crate's media (a forgotten seed:media shows up here), checked against the live site
      - run: bunx playwright test tests/e2e/privacy.spec.ts tests/e2e/media-live.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: https://curiousgeorge.dev
          PRIVACY_PATH: /?deploy=${{ github.sha }}
